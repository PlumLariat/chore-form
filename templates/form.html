{% extends "base.html" %}
{% block content %}
<p class="date">{{ today }} (Pacific Time)</p>
<h1>Chore Check</h1>
{% if submitted %}<div class="notice">Thanks! Your response was saved.</div>{% endif %}
<form method="post" action="/submit">
  {% for name, text in questions %}
  <div class="card">
    <fieldset>
      <legend>{{ text }}</legend>
      <label><input type="radio" name="{{ name }}" value="yes" required> Yes</label>
      <label><input type="radio" name="{{ name }}" value="no"> No</label>
    </fieldset>
  </div>
  {% endfor %}
  <button type="submit">Submit</button>
</form>
{% endblock %}
